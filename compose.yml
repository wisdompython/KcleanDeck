# Kleandeck: Postgres + Django (API & admin) + Next.js (site) behind Caddy.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#   docker compose exec backend python manage.py createsuperuser
#
# Site: http://localhost (or your SITE_ADDRESS) · Admin: /admin/

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kleandeck}
      POSTGRES_USER: ${POSTGRES_USER:-kleandeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      # Keep POSTGRES_PASSWORD URL-safe (letters/digits), as it's embedded here.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kleandeck}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kleandeck}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-backstage}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  media: # uploaded service and category photos; back up together with the database
  caddy_data:
  caddy_config:
